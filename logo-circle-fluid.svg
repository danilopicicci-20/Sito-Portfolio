<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gRing" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#8f7bff"/>
      <stop offset="100%" stop-color="#00e2b8"/>
    </linearGradient>
  </defs>

  <!-- sfondo solo per anteprima: il logo vero e proprio ha sfondo trasparente -->
  <rect width="240" height="240" rx="28" fill="#07070a"/>

  <!-- anello sottile -->
  <circle cx="120" cy="120" r="98" fill="none" stroke="rgba(244,242,238,.26)" stroke-width="1"/>

  <!-- onda principale: flusso a "S", stessa indole del concept a nastro -->
  <path d="M64 134 C 82 98, 100 98, 120 120 C 140 142, 158 142, 176 106"
        fill="none" stroke="url(#gRing)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- eco della stessa onda: profondità e senso di fluido -->
  <path d="M70 150 C 86 122, 102 122, 120 140 C 138 158, 154 158, 170 130"
        fill="none" stroke="url(#gRing)" stroke-width="2.5" stroke-linecap="round" opacity=".28"/>

  <!-- goccia: accento finale, dove l'onda "cade" -->
  <circle cx="176" cy="106" r="4.2" fill="url(#gRing)"/>
</svg>
