##############################################################################
# Fluids Studio — configurazione Netlify
#
# Il sito è statico e non ha backend né database: la superficie d'attacco si
# riduce a tre cose, e questo file le copre tutte e tre.
#
#   1. Codice di terzi che gira nella pagina  → CSP con script-src 'self'
#      (per questo GSAP, Three.js e i font stanno in vendor/ e assets/,
#      non su una CDN pubblica: se quella venisse compromessa, il codice
#      iniettato girerebbe qui con pieni poteri)
#   2. Il sito incorniciato in un iframe altrui per fingersi qualcos'altro
#      → frame-ancestors 'none' + X-Frame-Options
#   3. Downgrade a HTTP o sniffing del MIME type → HSTS + nosniff
#
# Netlify legge questo file alla radice del repo. Gli header valgono per le
# risposte servite dal CDN di Netlify, non per l'anteprima in locale.
##############################################################################

[build]
  # Sito statico: nessuna build. Netlify pubblica la radice del repo così com'è.
  publish = "."

# ---------------------------------------------------------------------------
# Header di sicurezza — applicati a ogni risorsa
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"

  [headers.values]

    # Content-Security-Policy — la difesa principale.
    # Se un giorno qualcuno riuscisse a iniettare uno <script> nella pagina,
    # il browser si rifiuterebbe di eseguirlo: nessuna origine esterna è
    # autorizzata e non c'è 'unsafe-inline'.
    #
    #   default-src 'self'   tutto ciò che non è coperto sotto: solo dal nostro dominio
    #   script-src  'self'   niente CDN, niente inline, niente eval
    #   style-src   'self'   il CSS sta tutto in styles.css, zero <style> e zero style=""
    #   img-src     data:    serve per la texture "grana" generata via SVG inline nel CSS
    #   font-src    'self'   i woff2 sono in assets/fonts/
    #   connect-src 'self'   il sito non chiama nessuna API: qualunque fetch verso
    #                        l'esterno verrebbe bloccato (utile contro l'esfiltrazione)
    #   base-uri / form-action 'none'  non c'è <base> e non ci sono form da dirottare
    #   frame-ancestors 'none'         nessuno può incorniciare il sito
    #   object-src 'none'              niente Flash/plugin, vettore storico di guai
    #
    # NOTA: se in futuro aggiungi analytics, un form o un embed (YouTube, Maps,
    # Calendly…), va autorizzata qui la loro origine, altrimenti non partono.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

    # Forza HTTPS per un anno anche se qualcuno digita http://.
    # 'preload' è volutamente assente: iscriversi alla lista dei browser è
    # difficile da annullare, meglio farlo solo a dominio definitivo e stabile.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Il browser non deve indovinare il tipo di un file: usa quello dichiarato.
    X-Content-Type-Options = "nosniff"

    # Ridondante rispetto a frame-ancestors, ma copre i browser più vecchi.
    X-Frame-Options = "DENY"

    # Verso l'esterno esce solo l'origine, e solo in HTTPS: mai il percorso
    # completo della pagina da cui l'utente arriva.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Il sito non usa nessuna di queste API: negarle in blocco significa che
    # non possono essere attivate nemmeno da codice iniettato.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"

    # Isola la pagina da eventuali finestre aperte da terzi.
    Cross-Origin-Opener-Policy = "same-origin"

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
# I nomi dei file non contengono un hash del contenuto, quindi HTML, CSS e JS
# di prima parte NON possono essere messi in cache a lungo: dopo un deploy i
# visitatori resterebbero su una versione vecchia. Netlify risponde comunque
# 304 grazie all'ETag, quindi il costo reale è quasi nullo.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# I font invece sono immutabili davvero: quel file, con quel nome, non
# cambierà mai contenuto. Un anno di cache, senza rivalidazione.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le librerie sono a versione fissa ma il nome non la contiene: cache lunga
# ma non "immutable", così un eventuale aggiornamento si propaga.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
